<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Monolith · Motion</title>
<style>
/*FONTS*/
html, body { margin: 0; background: #050505; }
canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Monolith, motion graphic for Instagram: 1080×1920, 30 fps, 25 s, 120 BPM.
// Every moment is a pure function of t, so the video can be rendered frame by frame.
// Key content stays between y 300 and 1250 (Reels header, caption and buttons).
const W = 1080, H = 1920, FPS = 30, TOTAL = 25.0;
const BK = [5, 5, 5], WH = [241, 241, 239], DK = [18, 18, 18];
const TAU = Math.PI * 2;
const c01 = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => c01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${c01(a)})`;
const E = {
  outCubic: (x) => 1 - Math.pow(1 - c01(x), 3),
  inCubic: (x) => Math.pow(c01(x), 3),
  inOutCubic: (x) => { x = c01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
  outExpo: (x) => { x = c01(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); },
  inExpo: (x) => { x = c01(x); return x === 0 ? 0 : Math.pow(2, 10 * x - 10); },
  outBack: (x, s = 1.70158) => { x = c01(x); const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); },
  inBack: (x, s = 1.70158) => { x = c01(x); return (s + 1) * x * x * x - s * x * x; },
  outBounce: (x) => {
    x = c01(x); const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x;
    if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375;
    return n * (x -= 2.625 / d) * x + 0.984375;
  },
};
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ---------------------------------------------------------------- drawing helpers
function rr(ctx, x, y, w, h, r) { w = Math.max(0, w); h = Math.max(0, h); ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function circ(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function font(ctx, size, weight = 900, ls = 0) { ctx.font = `${weight} ${size}px Inter`; ctx.letterSpacing = `${ls}px`; }
function txt(ctx, s, x, y, o) {
  ctx.save();
  font(ctx, o.size, o.weight || 900, o.ls || 0);
  ctx.textAlign = o.align || "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = rgba(o.color || WH, o.alpha ?? 1);
  // letter spacing is also added after the last letter: shift centred text back by half of it
  ctx.fillText(s, x + (o.align === "left" ? 0 : (o.ls || 0) / 2), y);
  ctx.restore();
}
function measure(ctx, s, size, weight = 900, ls = 0) { ctx.save(); font(ctx, size, weight, ls); const w = ctx.measureText(s).width; ctx.restore(); return w; }
function fitSize(ctx, s, size, max, weight = 900) { const w = measure(ctx, s, size, weight); return w > max ? (size * max) / w : size; }

/** a line of words that slide up out of a mask, one after the other */
function words(ctx, list, cx, y, size, t, t0, stagger, color, alpha = 1, weight = 900) {
  ctx.save();
  font(ctx, size, weight, -size * 0.02);
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  const space = ctx.measureText(" ").width;
  const widths = list.map((w) => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + space * (list.length - 1);
  let x = cx - total / 2;
  ctx.beginPath();
  ctx.rect(0, y - size * 0.8, W, size * 1.45);
  ctx.clip();
  list.forEach((w, k) => {
    const p = E.outExpo(seg(t, t0 + k * stagger, t0 + k * stagger + 0.55));
    if (p > 0) {
      ctx.fillStyle = rgba(color, alpha * Math.min(1, p * 1.6));
      ctx.fillText(w, x, y + (1 - p) * size * 1.2);
    }
    x += widths[k] + space;
  });
  ctx.restore();
}

/** the slab of the logo: front face, top and side */
function slab(ctx, cx, baseY, w, h, col, alpha = 1) {
  if (h <= 0) return;
  const d = w * 0.26;
  ctx.fillStyle = rgba(col, alpha * 0.55);
  ctx.beginPath(); ctx.moveTo(cx - w / 2, baseY - h); ctx.lineTo(cx - w / 2 + d, baseY - h - d * 0.8); ctx.lineTo(cx + w / 2 + d, baseY - h - d * 0.8); ctx.lineTo(cx + w / 2, baseY - h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(col, alpha * 0.3);
  ctx.beginPath(); ctx.moveTo(cx + w / 2, baseY - h); ctx.lineTo(cx + w / 2 + d, baseY - h - d * 0.8); ctx.lineTo(cx + w / 2 + d, baseY - d * 0.8); ctx.lineTo(cx + w / 2, baseY); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(col, alpha);
  ctx.fillRect(cx - w / 2, baseY - h, w, h);
}

function samplePath(pts, steps = 30) {
  // pts: [[x,y], ...] with optional quadratic control as [x,y,cx,cy]
  const out = [pts[0].slice(0, 2)];
  for (let i = 1; i < pts.length; i++) {
    const [x, y, qx, qy] = pts[i], [x0, y0] = out[out.length - 1];
    if (qx === undefined) { out.push([x, y]); continue; }
    for (let s = 1; s <= steps; s++) { const k = s / steps, u = 1 - k; out.push([u * u * x0 + 2 * u * k * qx + k * k * x, u * u * y0 + 2 * u * k * qy + k * k * y]); }
  }
  return out;
}
function partial(ctx, pts, f, color, width) {
  let total = 0; const lens = [0];
  for (let i = 1; i < pts.length; i++) { total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); lens.push(total); }
  const target = total * c01(f);
  let end = pts[0];
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    if (lens[i] <= target) { ctx.lineTo(pts[i][0], pts[i][1]); end = pts[i]; continue; }
    const k = (target - lens[i - 1]) / Math.max(1e-6, lens[i] - lens[i - 1]);
    end = [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)];
    ctx.lineTo(end[0], end[1]); break;
  }
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (f > 0) ctx.stroke();
  return end;
}
function hexPath(ctx, x, y, r) {
  ctx.beginPath();
  for (let q = 0; q < 6; q++) { const a = (q / 6) * TAU - TAU / 4; const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r; q ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath();
}
function shardPath(ctx, cx, cy, r) {
  ctx.beginPath(); ctx.moveTo(cx, cy - r * 1.2); ctx.lineTo(cx + r, cy - r * 0.2); ctx.lineTo(cx - r * 0.1, cy + r * 1.2); ctx.lineTo(cx - r, cy); ctx.closePath();
}
function pinPath(ctx, x, tipY, r) {
  // a map pin: round head, point at the bottom
  const cy = tipY - r * 1.75;
  const a = Math.acos(1 / 1.75);           // where the sides touch the head
  ctx.beginPath();
  ctx.moveTo(x, tipY);
  ctx.arc(x, cy, r, Math.PI / 2 + a, Math.PI / 2 - a + TAU, false);
  ctx.closePath();
}

// ---------------------------------------------------------------- film grain
const grain = [];
{
  const rnd = seeded(7);
  for (let k = 0; k < 4; k++) {
    const g = document.createElement("canvas"); g.width = g.height = 256;
    const gc = g.getContext("2d"), img = gc.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.floor(rnd() * 255); img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    gc.putImageData(img, 0, 0);
    grain.push(g);
  }
}
function drawGrain(ctx, t) {
  const g = grain[Math.floor(t * FPS) % grain.length];
  ctx.save(); ctx.globalAlpha = 0.035;
  ctx.fillStyle = ctx.createPattern(g, "repeat"); ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// camera shake after the big hits
const SHAKES = [[1.0, 12], [15.0, 16], [17.0, 7], [19.0, 20]];
function shake(t) {
  let x = 0, y = 0;
  for (const [t0, a] of SHAKES) { const d = t - t0; if (d >= 0 && d < 0.6) { const k = a * Math.exp(-d * 8); x += k * Math.sin(d * 71); y += k * Math.cos(d * 57); } }
  return [x, y];
}
function bg(ctx, c) { ctx.fillStyle = rgba(c); ctx.fillRect(-60, -60, W + 120, H + 120); }

// ================================================================ 1 · rise  [0, 3)
function sceneRise(ctx, t) {
  bg(ctx, BK);
  const cx = 540, gy = 1150, fy = 870;
  const z = 1 + E.inExpo(seg(t, 2.2, 3.0)) * 46;
  ctx.save();
  ctx.translate(cx, fy); ctx.scale(z, z); ctx.translate(-cx, -fy);
  for (let k = 0; k < 3; k++) {
    const d = t - 1.0 - k * 0.16;
    if (d > 0 && d < 1.7) {
      const f = E.outCubic(d / 1.7);
      ctx.beginPath(); ctx.ellipse(cx, gy, 60 + f * 640, (60 + f * 640) * 0.2, 0, 0, TAU);
      ctx.strokeStyle = rgba(WH, 0.4 * (1 - f)); ctx.lineWidth = 3; ctx.stroke();
    }
  }
  const half = E.inOutCubic(seg(t, 0.3, 0.85)) * 400;
  if (half > 0) { ctx.fillStyle = rgba(WH, 0.45); ctx.fillRect(cx - half, gy - 2, half * 2, 4); }
  circ(ctx, cx, gy, 10 * E.outBack(seg(t, 0.03, 0.3), 3)); ctx.fillStyle = rgba(WH); ctx.fill();
  const rise = E.outBack(seg(t, 0.82, 1.3), 1.4);
  slab(ctx, cx, gy, 210, 560 * rise, WH);
  ctx.restore();
  const a = 1 - seg(t, 2.15, 2.4);
  words(ctx, ["Un", "posto", "solo"], 540, 360, 96, t, 1.2, 0.1, WH, a);
  words(ctx, ["per", "i", "tuoi", "amici."], 540, 465, 96, t, 1.45, 0.1, WH, a);
}

// ================================================================ 2 · verbs  [3, 7)
const VERBS = [
  { w: "Scrivi.", sub: "Chat, vocali e giochi", icon: "chat" },
  { w: "Chiama.", sub: "Voce e video, fino a 4", icon: "call" },
  { w: "Racconta.", sub: "Storie di 24 ore", icon: "story" },
  { w: "Ritrovatevi.", sub: "Posizione in diretta", icon: "pin" },
];
function iconChat(ctx, u) {
  const list = [[270, 430, 330, true, 0.02], [810, 535, 270, false, 0.18], [270, 640, 210, true, 0.34]];
  list.forEach(([ax, y, w, left, t0], k) => {
    const s = E.outBack(seg(u, t0, t0 + 0.28), 2.4);
    if (s <= 0) return;
    const h = 84;
    ctx.save();
    ctx.translate(ax, y + h); ctx.scale(s, s); ctx.translate(-ax, -(y + h));
    rr(ctx, left ? ax : ax - w, y, w, h, 42);
    ctx.fillStyle = left ? rgba(BK, 0.12) : rgba(BK); ctx.fill();
    if (k === 2) for (let q = 0; q < 3; q++) {
      const b = Math.max(0, Math.sin(u * 16 - q * 0.9)) * 10;
      circ(ctx, ax + 62 + q * 38, y + h / 2 - b, 10); ctx.fillStyle = rgba(BK, 0.6); ctx.fill();
    }
    ctx.restore();
  });
}
function person(ctx, x, y, r, col) {
  ctx.save(); circ(ctx, x, y, r); ctx.clip();
  circ(ctx, x, y - r * 0.2, r * 0.3); ctx.fillStyle = rgba(col); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.62, r * 0.55, r * 0.42, 0, Math.PI, TAU); ctx.fill();
  ctx.restore();
}
function iconCall(ctx, u) {
  const x = 540, y = 545, s = E.outBack(seg(u, 0, 0.25), 2.2);
  for (let q = 0; q < 3; q++) {
    const f = (u * 1.7 + q / 3) % 1;
    if (u < 0.1) continue;
    circ(ctx, x, y, 115 + f * 170); ctx.strokeStyle = rgba(BK, 0.45 * (1 - f)); ctx.lineWidth = 6; ctx.stroke();
  }
  circ(ctx, x, y, 108 * s); ctx.fillStyle = rgba(BK); ctx.fill();
  if (s > 0.2) person(ctx, x, y + 6, 100 * s, WH);
}
function iconStory(ctx, u) {
  const x = 540, y = 545, s = E.outBack(seg(u, 0, 0.25), 2);
  circ(ctx, x, y, 104 * s); ctx.fillStyle = rgba(BK, 0.1); ctx.fill();
  if (s > 0.3) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    circ(ctx, -30, -28, 17); ctx.fillStyle = rgba(BK, 0.55); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-72, 50); ctx.lineTo(-18, -8); ctx.lineTo(20, 32); ctx.lineTo(42, 10); ctx.lineTo(78, 50); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const p = E.outCubic(seg(u, 0.06, 0.6)) * TAU, gap = 0.22;
  ctx.strokeStyle = rgba(BK); ctx.lineWidth = 13; ctx.lineCap = "round";
  for (let k = 0; k < 3; k++) {
    const a0 = -Math.PI / 2 + (k * TAU) / 3 + gap / 2, a1 = a0 + TAU / 3 - gap;
    const end = Math.min(a1, -Math.PI / 2 + p);
    if (end > a0) { ctx.beginPath(); ctx.arc(x, y, 132, a0, end); ctx.stroke(); }
  }
}
function iconPin(ctx, u) {
  const fade = seg(u, 0, 0.15);
  ctx.save();
  ctx.beginPath(); ctx.rect(120, 560, 840, 220); ctx.clip();
  ctx.strokeStyle = rgba(BK, 0.13 * fade); ctx.lineWidth = 3;
  for (let k = 0; k < 6; k++) { const yy = 600 + Math.pow(k / 5, 1.6) * 170; ctx.beginPath(); ctx.moveTo(120, yy); ctx.lineTo(960, yy); ctx.stroke(); }
  for (let k = -5; k <= 5; k++) { ctx.beginPath(); ctx.moveTo(540 + k * 40, 560); ctx.lineTo(540 + k * 190, 780); ctx.stroke(); }
  ctx.restore();
  const route = samplePath([[190, 760], [540, 640, 300, 600]]);
  ctx.setLineDash([2, 22]);
  partial(ctx, route, E.outCubic(seg(u, 0.25, 0.7)), rgba(BK, 0.7), 10);
  ctx.setLineDash([]);
  const drop = E.outBounce(seg(u, 0.05, 0.6));
  const tip = lerp(250, 640, drop);
  ctx.beginPath(); ctx.ellipse(540, 642, 54 * drop, 13 * drop, 0, 0, TAU); ctx.fillStyle = rgba(BK, 0.18); ctx.fill();
  if (u > 0.05) {
    pinPath(ctx, 540, tip, 62); ctx.fillStyle = rgba(BK); ctx.fill();
    circ(ctx, 540, tip - 62 * 1.75, 24); ctx.fillStyle = rgba(WH); ctx.fill();
  }
}
function sceneVerbs(ctx, t) {
  bg(ctx, WH);
  const k = Math.min(3, Math.floor(t - 3)), u = t - 3 - k, v = VERBS[k];
  const out = k < 3 ? E.inCubic(seg(u, 0.84, 1)) : 0;
  ctx.save();
  ctx.translate(0, -out * 160);
  ctx.globalAlpha = 1 - out;
  ({ chat: iconChat, call: iconCall, story: iconStory, pin: iconPin })[v.icon](ctx, u);
  const size = fitSize(ctx, v.w, 190, 900);
  const s = 1.45 - 0.45 * E.outExpo(seg(u, 0, 0.32));
  ctx.save();
  ctx.translate(540, 880); ctx.scale(s, s);
  txt(ctx, v.w, 0, 0, { size, color: BK, alpha: seg(u, 0, 0.1), ls: -size * 0.03 });
  ctx.restore();
  const sp = E.outExpo(seg(u, 0.14, 0.5));
  txt(ctx, v.sub, 540, 1010 + (1 - sp) * 40, { size: 46, weight: 500, color: BK, alpha: 0.6 * sp });
  ctx.restore();
  // the dot of each verb, under the text
  for (let q = 0; q < 4; q++) { circ(ctx, 540 + (q - 1.5) * 36, 1110, q === k ? 9 : 6); ctx.fillStyle = rgba(BK, q === k ? 1 : 0.2); ctx.fill(); }
  if (k === 3) { circ(ctx, 540, 530, E.inCubic(seg(u, 0.7, 1)) * 2300); ctx.fillStyle = rgba(BK); ctx.fill(); }
}

// ================================================================ 3 · phone  [7, 13)
const MARQ_A = "CHAT · GIOCHI · VOCALI · STICKER · ";
const MARQ_B = "MAPPA · ARRIVO IN DIRETTA · AMICI NEI PARAGGI · ";
function marquee(ctx, s, y, speed, t, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  font(ctx, 230, 900, -4);
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  const w = ctx.measureText(s).width;
  let x = -(((t * speed) % w) + w) % w;
  if (speed < 0) x -= w;
  ctx.fillStyle = rgba(WH, 0.08 * alpha);
  for (let k = 0; k < 4; k++) ctx.fillText(s, x + k * w - w, y);
  ctx.restore();
}
function bubble(ctx, s, left, sl, sw, y, t, t0) {
  const p = E.outBack(seg(t, t0, t0 + 0.3), 2.2);
  if (p <= 0) return;
  ctx.save();
  font(ctx, 30, 500);
  const w = ctx.measureText(s).width + 56, h = 74;
  const x = left ? sl + 26 : sl + sw - 26 - w;
  const ax = left ? x : x + w;
  ctx.translate(ax, y + h); ctx.scale(p, p); ctx.translate(-ax, -(y + h));
  rr(ctx, x, y, w, h, 37); ctx.fillStyle = left ? rgba(WH, 0.14) : rgba(WH); ctx.fill();
  ctx.fillStyle = left ? rgba(WH) : rgba(BK);
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  ctx.fillText(s, x + 28, y + h / 2 + 1);
  ctx.restore();
}
function chatScreen(ctx, t, sl, st, sw) {
  circ(ctx, sl + 62, st + 104, 30); ctx.fillStyle = rgba(WH, 0.92); ctx.fill();
  txt(ctx, "G", sl + 62, st + 105, { size: 30, color: BK });
  txt(ctx, "Giulia", sl + 108, st + 92, { size: 32, align: "left" });
  txt(ctx, "online", sl + 108, st + 124, { size: 22, weight: 500, align: "left", alpha: 0.5 });
  ctx.fillStyle = rgba(WH, 0.1); ctx.fillRect(sl, st + 162, sw, 2);
  bubble(ctx, "Stasera pizza?", true, sl, sw, st + 200, t, 7.5);
  bubble(ctx, "Ci sto!", false, sl, sw, st + 292, t, 8.0);
  bubble(ctx, "Prima una partita?", true, sl, sw, st + 384, t, 8.5);
  // the game in the chat
  const p = E.outBack(seg(t, 9.0, 9.3), 2);
  if (p <= 0) return;
  const cx0 = sl + 26, cy0 = st + 478, cw = 310, ch = 340;
  ctx.save();
  ctx.translate(cx0, cy0 + ch); ctx.scale(p, p); ctx.translate(-cx0, -(cy0 + ch));
  rr(ctx, cx0, cy0, cw, ch, 36); ctx.fillStyle = rgba(WH, 0.14); ctx.fill();
  const g = 234, gx = cx0 + 38, gy = cy0 + 34, c = g / 3;
  const lp = E.outCubic(seg(t, 9.05, 9.3));
  ctx.strokeStyle = rgba(WH, 0.55); ctx.lineWidth = 5; ctx.lineCap = "round";
  for (let k = 1; k <= 2; k++) {
    ctx.beginPath(); ctx.moveTo(gx + c * k, gy); ctx.lineTo(gx + c * k, gy + g * lp); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx, gy + c * k); ctx.lineTo(gx + g * lp, gy + c * k); ctx.stroke();
  }
  const mark = (r, col, kind, t0) => {
    const m = t0 === null ? 1 : E.outBack(seg(t, t0, t0 + 0.18), 2.5);
    if (m <= 0) return;
    const x = gx + c * col + c / 2, y = gy + c * r + c / 2, s = c * 0.26 * m;
    ctx.strokeStyle = rgba(WH); ctx.lineWidth = 9;
    if (kind === "x") { ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke(); }
    else { circ(ctx, x, y, s * 1.1); ctx.stroke(); }
  };
  mark(0, 0, "x", null); mark(0, 2, "o", null);
  mark(1, 1, "x", 9.3); mark(1, 2, "o", 9.55); mark(2, 2, "x", 9.8);
  const win = E.outCubic(seg(t, 9.85, 10.0));
  if (win > 0) {
    ctx.strokeStyle = rgba(WH); ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(gx + c / 2, gy + c / 2); ctx.lineTo(gx + c / 2 + (g - c) * win, gy + c / 2 + (g - c) * win); ctx.stroke();
  }
  txt(ctx, "Tris · hai vinto!", cx0 + cw / 2, cy0 + ch - 36, { size: 24, weight: 500, alpha: 0.75 * seg(t, 9.85, 10.05) });
  ctx.restore();
}
function mapScreen(ctx, t, sl, st, sw, sh) {
  ctx.fillStyle = rgba([24, 24, 24]); ctx.fillRect(sl, st, sw, sh);
  const P = (nx, ny) => [sl + nx * sw, st + ny * sh];
  const road = (a, b, w, al) => { const [x1, y1] = P(...a), [x2, y2] = P(...b); ctx.strokeStyle = rgba(WH, al); ctx.lineWidth = w; ctx.lineCap = "butt"; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  const [px, py] = P(0.64, 0.44); rr(ctx, px, py, sw * 0.3, sh * 0.15, 24); ctx.fillStyle = rgba(WH, 0.05); ctx.fill();
  [[[0.2, 0], [0.28, 1]], [[0, 0.52], [1, 0.5]], [[0.86, 0], [0.8, 1]], [[0, 0.15], [1, 0.2]], [[0, 0.86], [1, 0.9]]].forEach(([a, b]) => road(a, b, 8, 0.06));
  [[[0, 0.3], [1, 0.38]], [[0.62, 0], [0.48, 1]], [[0, 0.74], [1, 0.64]]].forEach(([a, b]) => road(a, b, 24, 0.1));
  const route = [P(0.04, 0.302), P(0.575, 0.345), P(0.53, 0.66)];
  const pts = samplePath([route[0], route[1], route[2]], 1);
  const m = E.inOutCubic(seg(t, 10.45, 11.9));
  ctx.setLineDash([4, 18]); partial(ctx, pts, 1, rgba(WH, 0.35), 6); ctx.setLineDash([]);
  const at = partial(ctx, pts, m, rgba(WH), 8);
  const [ux, uy] = route[2];
  const arrived = t >= 11.95;
  for (let q = 0; q < 2; q++) {
    const f = ((t - 10) * 1.2 + q / 2) % 1;
    circ(ctx, ux, uy, 20 + f * 70); ctx.strokeStyle = rgba(WH, 0.35 * (1 - f)); ctx.lineWidth = 3; ctx.stroke();
  }
  if (arrived) { const f = seg(t, 11.95, 12.5); circ(ctx, ux, uy, 30 + E.outCubic(f) * 200); ctx.strokeStyle = rgba(WH, 0.7 * (1 - f)); ctx.lineWidth = 5; ctx.stroke(); }
  circ(ctx, ux, uy, 16); ctx.fillStyle = rgba(WH); ctx.fill();
  circ(ctx, at[0], at[1], 32); ctx.fillStyle = rgba(WH); ctx.fill();
  circ(ctx, at[0], at[1], 25); ctx.fillStyle = rgba(BK); ctx.fill();
  txt(ctx, "G", at[0], at[1] + 1, { size: 26 });
  const dist = Math.max(0, Math.round(((1 - m) * 850) / 10) * 10);
  const label = arrived ? "Giulia è arrivata" : `Giulia · ${dist} m`;
  const bounce = arrived ? E.outBack(seg(t, 11.95, 12.2), 3) : E.outBack(seg(t, 10.3, 10.55), 2);
  ctx.save();
  const lw = measure(ctx, label, 28) + 60;
  ctx.translate(sl + sw / 2, st + 86); ctx.scale(bounce, bounce);
  rr(ctx, -lw / 2, -34, lw, 68, 34); ctx.fillStyle = rgba(WH); ctx.fill();
  txt(ctx, label, 0, 1, { size: 28, color: BK });
  ctx.restore();
}
function scenePhone(ctx, t) {
  bg(ctx, BK);
  const sw = seg(t, 10.0, 10.3);
  marquee(ctx, MARQ_A, 470, 260, t, 1 - sw);
  marquee(ctx, MARQ_A, 1110, -200, t, 1 - sw);
  marquee(ctx, MARQ_B, 470, 260, t, sw);
  marquee(ctx, MARQ_B, 1110, -200, t, sw);
  const enter = E.outBack(seg(t, 7.0, 7.6), 1.3), exit = E.inBack(seg(t, 12.5, 13.0), 1.6);
  const oy = (1 - enter) * 1400 - exit * 1800 + Math.sin((t - 7) * 2.1) * 6;
  const rot = ((-12 * (1 - enter) + 9 * exit + Math.sin((t - 7) * 1.7) * 1.2) * Math.PI) / 180;
  const pw = 480, ph = 940;
  ctx.save();
  ctx.translate(540, 790 + oy); ctx.rotate(rot);
  rr(ctx, -pw / 2, -ph / 2, pw, ph, 74); ctx.fillStyle = rgba(DK); ctx.fill();
  ctx.strokeStyle = rgba(WH); ctx.lineWidth = 7; ctx.stroke();
  const sl = -pw / 2 + 16, st = -ph / 2 + 16, sW = pw - 32, sH = ph - 32;
  ctx.save();
  rr(ctx, sl, st, sW, sH, 60); ctx.clip();
  const sx = -E.inOutCubic(seg(t, 10.0, 10.4)) * sW;
  if (sx > -sW) chatScreen(ctx, t, sl + sx, st, sW);
  if (t > 10.0) mapScreen(ctx, t, sl + sx + sW, st, sW, sH);
  ctx.restore();
  rr(ctx, -62, -ph / 2 + 30, 124, 30, 15); ctx.fillStyle = rgba(BK); ctx.fill();
  ctx.restore();
}

// ================================================================ 4 · bond  [13, 16)
const SHARDS = (() => {
  const rnd = seeded(11), out = [];
  for (let q = 0; q < 6; q++) for (let s = 0; s < 3; s++) {
    const a0 = (q / 6) * TAU - TAU / 4, a1 = ((q + 1) / 6) * TAU - TAU / 4;
    const r0 = s / 3, r1 = (s + 1) / 3, am = lerp(a0, a1, 0.3 + rnd() * 0.4);
    out.push({ pts: [[Math.cos(a0) * r0, Math.sin(a0) * r0], [Math.cos(a0) * r1, Math.sin(a0) * r1], [Math.cos(am) * r1 * 0.9, Math.sin(am) * r1 * 0.9], [Math.cos(a1) * r1, Math.sin(a1) * r1], [Math.cos(a1) * r0, Math.sin(a1) * r0]], spin: (rnd() - 0.5) * 6, dist: 420 + rnd() * 700, drift: rnd() * 0.25 });
  }
  return out;
})();
function badge(ctx, x, y, r, a = 1) {
  hexPath(ctx, x, y, r); ctx.fillStyle = rgba(WH, a); ctx.fill();
  hexPath(ctx, x, y, r * 0.82); ctx.strokeStyle = rgba(BK, 0.2 * a); ctx.lineWidth = 6; ctx.stroke();
  slab(ctx, x - r * 0.06, y + r * 0.22, r * 0.36, r * 0.62, BK, a);
  txt(ctx, "100", x, y + r * 0.5, { size: r * 0.24, color: BK, alpha: a });
}
function shatter(ctx, t, x, y, r) {
  const p = seg(t, 15.85, 16.6);
  if (p <= 0 || p >= 1) return;
  for (const s of SHARDS) {
    const c = s.pts.reduce((m, q) => [m[0] + q[0] / s.pts.length, m[1] + q[1] / s.pts.length], [0, 0]);
    const len = Math.hypot(c[0], c[1]) || 1;
    const d = E.outCubic(p) * s.dist;
    ctx.save();
    ctx.translate(x + c[0] * r + (c[0] / len) * d, y + c[1] * r + (c[1] / len) * d + p * p * 200);
    ctx.rotate(s.spin * p);
    ctx.beginPath(); s.pts.forEach((q, i) => { const px = (q[0] - c[0]) * r, py = (q[1] - c[1]) * r; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.closePath();
    ctx.fillStyle = rgba(WH, 1 - p); ctx.fill();
    ctx.restore();
  }
}
function sceneBond(ctx, t) {
  bg(ctx, BK);
  const top = 1 - seg(t, 15.75, 15.95);
  txt(ctx, "LEGAME", 540, 300, { size: 32, weight: 500, ls: 10, alpha: 0.55 * seg(t, 13.0, 13.3) * top });
  words(ctx, ["Più", "vi", "scrivete,"], 540, 385, 88, t, 13.05, 0.09, WH, top);
  words(ctx, ["più", "cresce."], 540, 485, 88, t, 13.3, 0.09, WH, top);
  const n = 1 + Math.round(99 * E.inOutCubic(seg(t, 13.3, 14.95)));
  const out = seg(t, 15.0, 15.12);
  if (out < 1) {
    const pulse = 1 + 0.04 * Math.max(0, Math.sin(((t - 13.3) / 0.125) * Math.PI)) * (t > 13.3 && t < 15 ? 1 : 0);
    ctx.save(); ctx.translate(540, 760); ctx.scale(pulse * (1 - 0.3 * out), pulse * (1 - 0.3 * out));
    txt(ctx, String(n), 0, 0, { size: 270, alpha: (1 - out) * seg(t, 13.1, 13.35), ls: -8 });
    ctx.restore();
    txt(ctx, "giorni di fila", 540, 915, { size: 44, weight: 500, alpha: 0.55 * (1 - out) * seg(t, 13.2, 13.5) });
  }
  const H0 = [70, 120, 180, 250, 330], sink = 1 - E.inCubic(seg(t, 15.0, 15.3));
  for (let k = 0; k < 5; k++) {
    const tk = 13.3 + (1.65 * k) / 4;
    const g = E.outBack(seg(t, tk, tk + 0.35), 2) * sink;
    slab(ctx, 540 + (k - 2) * 150, 1215, 74, H0[k] * g, WH, 0.3 + 0.17 * k);
  }
  if (t >= 15.0 && t < 15.85) {
    const s = E.outExpo(seg(t, 15.0, 15.3));
    ctx.save(); ctx.translate(540, 760); ctx.scale(2.4 - 1.4 * s, 2.4 - 1.4 * s);
    badge(ctx, 0, 0, 170, seg(t, 15.0, 15.06));
    ctx.restore();
    const f = seg(t, 15.0, 15.7);
    circ(ctx, 540, 760, 170 + E.outCubic(f) * 500); ctx.strokeStyle = rgba(WH, 0.6 * (1 - f)); ctx.lineWidth = 8 * (1 - f) + 1; ctx.stroke();
  }
  shatter(ctx, t, 540, 760, 170);
  const flash = 1 - seg(t, 15.0, 15.35);
  if (t >= 15.0 && flash > 0) { ctx.fillStyle = rgba(WH, 0.5 * flash); ctx.fillRect(-60, -60, W + 120, H + 120); }
}

// ================================================================ 5 · shard  [16, 17)
function sceneShard(ctx, t) {
  bg(ctx, BK);
  shatter(ctx, t, 540, 760, 170);
  words(ctx, ["Spazi", "per"], 540, 370, 92, t, 16.02, 0.07, WH);
  words(ctx, ["il", "tuo", "gruppo."], 540, 470, 92, t, 16.12, 0.07, WH);
  const rail = E.outCubic(seg(t, 16.0, 16.25));
  rr(ctx, 160, 600 + (1 - rail) * 290, 140, 580 * rail, 44); ctx.fillStyle = rgba(WH, 0.08); ctx.fill();
  const from = [[-200, 300], [1300, 500], [-200, 1500], [1300, 1700]];
  for (let k = 0; k < 4; k++) {
    const t0 = 16.0 + k * 0.125, p = E.outBack(seg(t, t0 - 0.12, t0 + 0.1), 1.6);
    const x = lerp(from[k][0], 230, p), y = lerp(from[k][1], 680 + k * 140, p);
    ctx.save(); ctx.translate(x, y); ctx.rotate((1 - p) * 4);
    shardPath(ctx, 0, 0, 38); ctx.fillStyle = rgba(WH, k === 1 ? 1 : 0.55); ctx.fill();
    ctx.restore();
    const f = seg(t, t0 + 0.08, t0 + 0.45);
    if (f > 0 && f < 1) { circ(ctx, 230, 680 + k * 140, 40 + f * 70); ctx.strokeStyle = rgba(WH, 0.5 * (1 - f)); ctx.lineWidth = 3; ctx.stroke(); }
  }
  for (let k = 0; k < 5; k++) {
    const p = E.outCubic(seg(t, 16.4 + k * 0.06, 16.7 + k * 0.06));
    const y = 650 + k * 120;
    circ(ctx, 370, y + 15, 8 * p); ctx.fillStyle = rgba(WH, 0.6); ctx.fill();
    rr(ctx, 400, y, (520 - k * 50) * p, 30, 15); ctx.fillStyle = rgba(WH, k < 3 ? 0.85 : 0.35); ctx.fill();
  }
  const flash = seg(t, 16.88, 17.0);
  if (flash > 0) { ctx.fillStyle = rgba(WH, E.inCubic(flash)); ctx.fillRect(-60, -60, W + 120, H + 120); }
}

// ================================================================ 6 · safe  [17, 19)
function miniIcon(ctx, kind, x, y, s, col) {
  ctx.fillStyle = rgba(col); ctx.strokeStyle = rgba(col); ctx.lineWidth = s * 0.16;
  if (kind === 0) { rr(ctx, x - s, y - s * 0.45, s * 2, s * 0.9, s * 0.45); ctx.fill(); }
  else if (kind === 1) { pinPath(ctx, x, y + s, s * 0.55); ctx.fill(); }
  else if (kind === 2) { circ(ctx, x, y, s * 0.8); ctx.stroke(); }
  else if (kind === 3) { hexPath(ctx, x, y, s); ctx.fill(); }
  else { shardPath(ctx, x, y, s * 0.75); ctx.fill(); }
}
function sceneSafe(ctx, t) {
  bg(ctx, WH);
  const cx = 540, cy = 590;
  const p = seg(t, 18.3, 18.95);
  const g = 1 - E.inBack(p, 1.4);
  ctx.save();
  ctx.translate(540, 800); ctx.scale(Math.max(0, g), Math.max(0, g)); ctx.translate(-540, -800);
  const shield = samplePath([[cx, cy - 230], [cx + 190, cy - 150], [cx + 165, cy + 80], [cx, cy + 240, cx + 120, cy + 200], [cx - 165, cy + 80, cx - 120, cy + 200], [cx - 190, cy - 150], [cx, cy - 230]], 24);
  const sp = E.outCubic(seg(t, 17.0, 17.5));
  ctx.beginPath(); shield.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath();
  ctx.fillStyle = rgba(BK, 0.06 * sp); ctx.fill();
  partial(ctx, shield, sp, rgba(BK), 14);
  partial(ctx, samplePath([[cx - 72, cy + 4], [cx - 16, cy + 64], [cx + 92, cy - 66]]), E.outCubic(seg(t, 17.42, 17.62)), rgba(BK), 20);
  const f = seg(t, 17.62, 18.3);
  if (f > 0 && f < 1) for (let q = 0; q < 2; q++) { const ff = c01(f * 1.3 - q * 0.3); circ(ctx, cx, cy, 250 + E.outCubic(ff) * 260); ctx.strokeStyle = rgba(BK, 0.3 * (1 - ff)); ctx.lineWidth = 4; ctx.stroke(); }
  const s = 1.4 - 0.4 * E.outExpo(seg(t, 17.05, 17.35));
  ctx.save(); ctx.translate(540, 1000); ctx.scale(s, s);
  txt(ctx, "Al sicuro.", 0, 0, { size: 150, color: BK, alpha: seg(t, 17.05, 17.13), ls: -5 });
  ctx.restore();
  const sb = E.outExpo(seg(t, 17.25, 17.6));
  txt(ctx, "SOS, blocco e backup cifrato", 540, 1115 + (1 - sb) * 30, { size: 44, weight: 500, color: BK, alpha: 0.6 * sb });
  ctx.restore();
  // everything spirals into the centre
  if (p > 0) {
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * TAU + E.inCubic(p) * TAU * 1.3;
      const r = 620 * (1 - E.inCubic(p));
      miniIcon(ctx, k % 5, 540 + Math.cos(a) * r, 800 + Math.sin(a) * r * 1.2, 46 * (1 - 0.7 * p), BK);
    }
  }
  const cover = E.inExpo(seg(t, 18.86, 19.0));
  if (cover > 0) { circ(ctx, 540, 800, cover * 2300); ctx.fillStyle = rgba(BK); ctx.fill(); }
}

// ================================================================ 7 · logo  [19, 25]
const DUST = (() => { const r = seeded(5), out = []; for (let i = 0; i < 60; i++) out.push([r() * W, 280 + r() * 1000, 1.5 + r() * 2.5, r() * TAU]); return out; })();
function sceneLogo(ctx, t) {
  bg(ctx, BK);
  const z = 1 + 0.035 * seg(t, 19, 25);
  ctx.save(); ctx.translate(540, 860); ctx.scale(z, z); ctx.translate(-540, -860);
  for (const [x, y, r, ph] of DUST) { const tw = 0.5 + 0.5 * Math.sin(t * 2.4 + ph); circ(ctx, x, y, r); ctx.fillStyle = rgba(WH, 0.32 * tw * seg(t, 19.2, 20)); ctx.fill(); }
  const base = 880;
  for (let k = 0; k < 4; k++) {
    const f = ((t - 19) / 3.2 + k / 4) % 1;
    if (t < 19.3) continue;
    ctx.beginPath(); ctx.ellipse(540, base, 80 + f * 560, (80 + f * 560) * 0.2, 0, 0, TAU);
    ctx.strokeStyle = rgba(WH, 0.16 * (1 - f)); ctx.lineWidth = 2.5; ctx.stroke();
  }
  const sh = seg(t, 19.0, 19.8);
  if (sh < 1) { circ(ctx, 540, base - 200, E.outExpo(sh) * 1000); ctx.strokeStyle = rgba(WH, 0.6 * (1 - sh)); ctx.lineWidth = 2 + 10 * (1 - sh); ctx.stroke(); }
  const gl = E.outCubic(seg(t, 19.0, 19.4)) * 300;
  ctx.fillStyle = rgba(WH, 0.3); ctx.fillRect(540 - gl, base - 1.5, gl * 2, 3);
  slab(ctx, 540, base, 170, 430 * E.outBack(seg(t, 19.0, 19.45), 1.5), WH);
  ctx.restore();
  const wp = E.outExpo(seg(t, 19.3, 20.3));
  txt(ctx, "MONOLITH", 540, 1015, { size: 128, ls: lerp(90, 8, wp), alpha: seg(t, 19.3, 19.6) });
  const tg = E.outExpo(seg(t, 20.2, 20.7));
  txt(ctx, "Tutto quello che conta, tra amici.", 540, 1105 + (1 - tg) * 30, { size: 44, weight: 500, alpha: 0.65 * tg });
  const pill = E.outBack(seg(t, 21.0, 21.35), 2.2);
  if (pill > 0) {
    const label = "Gratis per Android · Link in bio", pw = measure(ctx, label, 34) + 96;
    ctx.save(); ctx.translate(540, 1195); ctx.scale(pill, pill);
    rr(ctx, -pw / 2, -50, pw, 100, 50); ctx.fillStyle = rgba(WH); ctx.fill();
    txt(ctx, label, 0, 1, { size: 34, color: BK });
    ctx.restore();
  }
  const flash = 1 - seg(t, 19.0, 19.25);
  if (flash > 0) { ctx.fillStyle = rgba(WH, 0.35 * flash); ctx.fillRect(-60, -60, W + 120, H + 120); }
  const fade = seg(t, 24.35, 25.0);
  if (fade > 0) { ctx.fillStyle = rgba(BK, fade); ctx.fillRect(-60, -60, W + 120, H + 120); }
}

// ---------------------------------------------------------------- timeline
const SCENES = [
  { start: 0, end: 3, draw: sceneRise },
  { start: 3, end: 7, draw: sceneVerbs },
  { start: 7, end: 13, draw: scenePhone },
  { start: 13, end: 16, draw: sceneBond },
  { start: 16, end: 17, draw: sceneShard },
  { start: 17, end: 19, draw: sceneSafe },
  { start: 19, end: 25, draw: sceneLogo },
];
function render(ctx, t) {
  t = Math.max(0, Math.min(TOTAL - 1e-6, t));
  const s = SCENES.find((x) => t >= x.start && t < x.end) || SCENES[SCENES.length - 1];
  const [dx, dy] = shake(t);
  ctx.setTransform(1, 0, 0, 1, dx, dy);
  s.draw(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawGrain(ctx, t);
}

// the sounds, at the same moments as the pictures (the music is in the score)
const CUES = [
  ["tick", 0.05, { f: 2400, g: 0.5 }], ["whoosh", 0.3, { dur: 0.55, up: 1, g: 0.45 }], ["impact", 1.0, { g: 0.9 }],
  ...[1.2, 1.3, 1.4, 1.45, 1.55, 1.65, 1.75].map((t, i) => ["tick", t, { f: 1500 + i * 120, g: 0.18 }]),
  ["whoosh", 2.2, { dur: 0.8, up: 1, g: 0.6 }],
  ["pop", 3.04, { f: 520 }], ["pop", 3.2, { f: 660 }], ["pop", 3.36, { f: 780 }],
  ["ring", 4.0, {}], ["swoosh", 5.02, { g: 0.6 }], ["thud", 6.2, {}], ["tick", 6.38, { f: 900, g: 0.3 }],
  ["whoosh", 6.7, { dur: 0.32, up: 1, g: 0.5 }],
  ["whoosh", 7.0, { dur: 0.6, up: 0, g: 0.55 }],
  ["pop", 7.52, { f: 600 }], ["pop", 8.02, { f: 820 }], ["pop", 8.52, { f: 600 }], ["pop", 9.02, { f: 480 }],
  ["tick", 9.3, { f: 1800, g: 0.5 }], ["tick", 9.55, { f: 1500, g: 0.5 }], ["tick", 9.8, { f: 1800, g: 0.5 }], ["chime", 9.88, {}],
  ["whoosh", 10.0, { dur: 0.4, up: 1, g: 0.45 }], ["ping", 11.95, {}], ["whoosh", 12.5, { dur: 0.5, up: 1, g: 0.6 }],
  ...Array.from({ length: 14 }, (_, i) => ["tick", 13.3 + i * 0.125, { f: 1200 + i * 90, g: 0.32 }]),
  ["impact", 15.0, { g: 0.9 }], ["shimmer", 15.04, {}], ["shatter", 15.85, {}],
  ["tink", 16.0, { f: 1568 }], ["tink", 16.125, { f: 1760 }], ["tink", 16.25, { f: 1976 }], ["tink", 16.375, { f: 2349 }],
  ["swoosh", 17.0, { g: 0.45 }], ["click", 17.45, {}],
  ["whoosh", 18.3, { dur: 0.7, up: 1, g: 0.65 }],
  ["impact", 19.0, { g: 1.0 }], ["shimmer", 19.35, {}], ["pop", 21.0, { f: 700 }],
];

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
window.MOTION = {
  W, H, FPS, TOTAL, CUES,
  SCENES: SCENES.map((s) => ({ start: s.start, dur: s.end - s.start })),
  frame: (t) => render(ctx, t),
};
document.fonts.ready
  .then(() => Promise.all([document.fonts.load("500 40px Inter"), document.fonts.load("900 40px Inter")]))
  .then(() => { render(ctx, 0); window.MOTION.ready = true; });
// preview in a browser: plays in a loop
if (!navigator.webdriver) {
  const t0 = performance.now();
  const loop = (now) => { if (window.MOTION.ready) render(ctx, ((now - t0) / 1000) % TOTAL); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
