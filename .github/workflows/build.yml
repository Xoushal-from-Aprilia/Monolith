name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.MONOLITH_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/monolith.jks"
            echo "MONOLITH_KEYSTORE=$RUNNER_TEMP/monolith.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          MONOLITH_KEYSTORE_PASSWORD: ${{ secrets.MONOLITH_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          log = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          errs = [l for l in log if re.match(r'^e: ', l) or 'error:' in l or 'What went wrong' in l or 'Unresolved reference' in l or 'FAILED' in l]
          if not errs:
              errs = log[-80:]
          seen = []
          for l in errs:
              l = l.replace('file:///home/runner/work/Monolith/Monolith/', '')
              if l not in seen:
                  seen.append(l)
          # pack into a few annotations (GitHub keeps max 10 per step)
          chunk, chunks = [], []
          for l in seen:
              chunk.append(l)
              if len(chunk) == 25:
                  chunks.append(chunk); chunk = []
          if chunk: chunks.append(chunk)
          for c in chunks[:10]:
              msg = '%0A'.join(x.replace('%', '%25').replace('\r', '') for x in c)
              print('::error title=build::' + msg)
          PY
          tail -150 build.log >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" "Monolith-${{ github.run_number }}.apk"
          gh release create "build-${{ github.run_number }}" "Monolith-${{ github.run_number }}.apk" \
            --title "Monolith build ${{ github.run_number }}" \
            --notes "APK generato automaticamente dal commit ${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: monolith-apk
          path: Monolith-*.apk
