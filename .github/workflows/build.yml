name: Build APK

on:
  push:
    branches: [ main ]
    # the download site (site/) and the developer key (dev/) do not need a new APK
    paths-ignore: [ "site/**", "dev/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.MONOLITH_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/monolith.jks"
            echo "MONOLITH_KEYSTORE=$RUNNER_TEMP/monolith.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          MONOLITH_KEYSTORE_PASSWORD: ${{ secrets.MONOLITH_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          log = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          errs = [l for l in log if re.match(r'^e: ', l) or 'error:' in l or 'What went wrong' in l or 'Unresolved reference' in l or 'FAILED' in l]
          if not errs:
              errs = log[-80:]
          seen = []
          for l in errs:
              l = l.replace('file:///home/runner/work/Monolith/Monolith/', '')
              if l not in seen:
                  seen.append(l)
          # pack into a few annotations (GitHub keeps max 10 per step)
          chunk, chunks = [], []
          for l in seen:
              chunk.append(l)
              if len(chunk) == 25:
                  chunks.append(chunk); chunk = []
          if chunk: chunks.append(chunk)
          for c in chunks[:10]:
              msg = '%0A'.join(x.replace('%', '%25').replace('\r', '') for x in c)
              print('::error title=build::' + msg)
          PY
          tail -150 build.log >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          KIDS=$(grep -oP 'kidsVersion = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "Monolith-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/kids/release/app-kids-release.apk "Monolith-Kids-${{ github.run_number }}.apk"
          gh release create "build-${{ github.run_number }}" "Monolith-${{ github.run_number }}.apk" "Monolith-Kids-${{ github.run_number }}.apk" \
            --title "Monolith $VERSION · build ${{ github.run_number }}" \
            --notes "Monolith $VERSION e Monolith Kids $KIDS, generati automaticamente dal commit ${{ github.sha }}"

      - name: Publish developer dashboard
        # only when the commit message asks for it; useless without the developer's own key
        if: success() && contains(github.event.head_commit.message, '[dashboard]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dashboard/build/outputs/apk/release/dashboard-release.apk "Monolith-Dev-${{ github.run_number }}.apk"
          gh release create "dashboard-${{ github.run_number }}" "Monolith-Dev-${{ github.run_number }}.apk" --prerelease \
            --title "Monolith Dev ${{ github.run_number }}" \
            --notes "Dashboard sviluppatore dal commit ${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: monolith-apk
          path: Monolith-*.apk

  shots:
    # screenshots of the main screens, only when the commit message asks for them
    if: contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Robolectric jar
        run: |
          mkdir -p "$HOME/robolectric"
          for V in 14-robolectric-10818077-i7 15-robolectric-12650502-i7; do
            J=android-all-instrumented-$V.jar
            P=org/robolectric/android-all-instrumented/$V/$J
            for i in 1 2 3 4 5 6; do
              for M in https://repo1.maven.org/maven2 https://maven-central.storage-download.googleapis.com/maven2; do
                curl -fsSL --retry 3 -o "$HOME/robolectric/$J" "$M/$P" && break 2
              done
              sleep 15
            done
          done
          ls -la "$HOME/robolectric"
          echo "ROBOLECTRIC_DIR=$HOME/robolectric" >> "$GITHUB_ENV"

      - name: Render screenshots
        run: |
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest --tests 'com.monolith.app.Shots' :dashboard:testDebugUnitTest --no-daemon --continue 2>&1 | tail -60 > shots.log || true

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp -r app/build/shots out/ 2>/dev/null || true
          mkdir -p out/dev && cp -r dashboard/build/shots/. out/dev/ 2>/dev/null || true
          cp shots.log out/ 2>/dev/null || true
          python3 - <<'PY'
          import glob, re, os
          out = []
          for f in glob.glob('app/build/test-results/testStandardDebugUnitTest/*.xml') + glob.glob('dashboard/build/test-results/testDebugUnitTest/*.xml'):
              s = open(f, encoding='utf-8', errors='replace').read()
              for m in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<failure message="([^"]*)"[^>]*>([^<]*)', s):
                  out.append(m.group(1) + ': ' + m.group(2)[:300] + '\n' + m.group(3)[:2500])
          open('out/failures.txt', 'w').write('\n\n'.join(out) or 'ok')
          PY
          cd out && zip -qr ../shots.zip . && cd ..
          gh release create "shots-${{ github.run_number }}" shots.zip --prerelease \
            --title "Screenshots ${{ github.run_number }}" --notes "Screenshots of ${{ github.sha }}"
